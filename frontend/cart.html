<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - MyEduConnect</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/shop.css">
</head>
<body>
    <nav class="lms-navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="dashboard.html" class="nav-brand">MyEduConnect</a>
                <div class="nav-links">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="courses.html">All Courses</a>
                </div>
            </div>
            <div class="nav-right">
                <a href="cart.html" class="icon-btn" aria-label="Cart" style="position: relative; margin-right: 8px;">
                    <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="portal-main">
        <h1 class="page-title">Shopping Cart</h1>
        <div class="details-layout">
            <div class="cart-items" id="cartItemsContainer"></div>
            <div class="details-sidebar">
                <div class="summary-card">
                    <h3>Order Summary</h3>
                    <div class="summary-row"><span>Total Courses:</span> <strong id="totalCourses">0</strong></div>
                    <div class="summary-row summary-total"><span>Total Price:</span> <strong id="totalPrice">RM 0</strong></div>
                    <a href="payment.html" id="checkoutBtn" class="btn-primary full-width text-center" style="margin-top: 16px;">Proceed To Payment</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/cart.js"></script>
</body>
</html>
